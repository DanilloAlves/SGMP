<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_self">
  <title>Login - Gestão de Inventário</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1e293b;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .login-icon-box {
      width: 65px;
      height: 65px;
      background-color: #fef2f2;
      color: #991b1b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 1.75rem;
    }
    .btn-danger-custom {
      background-color: #991b1b !important;
      border-color: #991b1b !important;
      color: #ffffff !important;
      transition: background-color 0.2s;
    }
    .btn-danger-custom:hover {
      background-color: #7f1d1d !important;
      border-color: #7f1d1d !important;
    }
    .text-primary-custom {
      color: #991b1b !important;
    }
  </style>
</head>
<body>

<div class="login-card text-center">
  <div class="login-icon-box">
    <i class="fa-solid fa-fire"></i>
  </div>
  
  <h3 class="fw-bold text-primary-custom mb-1">SGMP — CBMPE</h3>
  <p class="text-muted small mb-4">Sistema de Gestão de Materiais e Patrimônio</p>

  <? if (typeof erro !== 'undefined' && erro) { ?>
    <div class="alert alert-danger py-2 fs-6 small shadow-sm mb-4" role="alert">
      <i class="fa-solid fa-triangle-exclamation me-1"></i> <?= erro ?>
    </div>
  <? } ?>

  <div class="d-grid gap-2 mt-2">
    <a id="btnEntrarGoogle" href="<?= (typeof appUrl !== 'undefined' && appUrl) ? appUrl.split('?')[0] + '?auth=true' : '#' ?>" target="_self" class="btn btn-danger-custom py-2.5 fw-bold shadow-sm text-decoration-none" onclick="return executarLoginGoogle(event)">
      <i class="fa-brands fa-google me-2"></i> Entrar com Conta Google
    </a>
  </div>

  <div class="mt-3">
    <button onclick="abrirModalSolicitarAcesso()" class="btn btn-outline-secondary btn-sm w-100 fw-bold py-2">
      <i class="fa-solid fa-user-plus me-1"></i> Não tem acesso? Solicitar Acesso / Criar PIN
    </button>
  </div>
  
  <div class="mt-4 pt-3 border-top">
    <p class="text-muted small mb-0"><i class="fa-solid fa-shield-halved me-1 text-secondary"></i> Acesso restrito a militares autorizados na base de dados.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

<script>
  let APP_URL = "<?= (typeof appUrl !== 'undefined' && appUrl) ? appUrl : '' ?>";
  if (!APP_URL) {
    try {
      google.script.run.withSuccessHandler(function(url) {
        if (url) {
          APP_URL = url;
          var btn = document.getElementById('btnEntrarGoogle');
          if (btn) btn.href = url.split('?')[0] + '?auth=true';
        }
      }).getAppUrl();
    } catch (e) {}
  }

  function executarLoginGoogle(event) {
    var btn = document.getElementById('btnEntrarGoogle');
    var currentUrl = (window.location.href || '').split('?')[0].split('#')[0];
    var targetUrl = (currentUrl && currentUrl.indexOf('script.google.com') !== -1)
      ? currentUrl + '?auth=true'
      : (btn && btn.getAttribute('href') && btn.getAttribute('href') !== '#' ? btn.getAttribute('href') : '');
    if (targetUrl) {
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Entrando...';
      btn.style.pointerEvents = 'none';
      window.location.href = targetUrl;
      if (event) event.preventDefault();
      return false;
    }
    event.preventDefault();
    Swal.fire({ title: 'Entrando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    google.script.run
      .withSuccessHandler(url => {
        window.location.href = url.split('?')[0] + '?auth=true';
      })
      .withFailureHandler(err => {
        Swal.fire('Erro', "Erro ao autenticar: " + err.message, 'error');
      })
      .getAppUrl();
    return false;
  }

  function abrirModalSolicitarAcesso() {
    let optionsOmes = '<option value="" disabled selected>Selecione a OME...</option>';
    const listaOficialOmes = [
      "1º GB Vitoria Stº Antão", "2º GB Caruaru", "3º GB Serra Talhada", "4º GB Petrolina", 
      "5º GB Salgueiro", "6º GB Garanhuns", "7º GB Carpina", "9º GB Arcoverde", 
      "ABMG", "AECI", "AjG", "CAT/AG", "CAT/RMR", "CAT/SE", "CAT/ZM", 
      "CCS", "CEAO", "CEFD", "CI", "CINT", "CMAN", "CPO", "CPPA", "CPP", 
      "DEIP", "DF", "DGO", "DIESP", "DIM", "DINTER I", "DINTER II", 
      "DJD", "DLOG", "DGP", "DPLAG", "DTIC", "DVP", "GBAPH", "GBI", 
      "GBMAR", "GBS", "GCG", "GSG"
    ];
    optionsOmes += listaOficialOmes.map(u => `<option value="${u}">${u}</option>`).join('');

    Swal.fire({
      title: '<i class="fa-solid fa-user-shield text-danger me-2"></i> Solicitação de Acesso',
      html: `
        <div class="text-start p-2 small">
          <p class="text-muted mb-3">Preencha seus dados. Para segurança contra fraudes, é obrigatório informar seu <strong>e-mail institucional @bombeiros.pe.gov.br</strong> para validação de identidade via código.</p>
          
          <div class="mb-2">
            <label class="form-label fw-bold">Nome Completo / Posto/Grad:</label>
            <input type="text" id="cad_nome" class="form-control form-control-sm text-uppercase" placeholder="EX: CB BM SILVA...">
          </div>
          
          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label fw-bold">CPF:</label>
              <input type="text" id="cad_cpf" class="form-control form-control-sm" placeholder="Somente números" maxlength="11">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">PIN de Assinatura (4-6 dígitos):</label>
              <input type="password" id="cad_pin" class="form-control form-control-sm" maxlength="6" placeholder="Ex: 1234">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label fw-bold">E-mail Google de Login (Acesso diário):</label>
            <input type="email" id="cad_email" class="form-control form-control-sm" placeholder="seu.email@gmail.com ou institucional">
            <div class="text-muted" style="font-size: 0.72rem;">Conta Google que você usará para clicar no botão "Entrar com Conta Google".</div>
          </div>

          <div class="mb-2 p-2 bg-danger-subtle rounded border border-danger-subtle">
            <label class="form-label fw-bold text-danger mb-0"><i class="fa-solid fa-shield-halved me-1"></i> E-mail Institucional (@bombeiros.pe.gov.br):</label>
            <input type="email" id="cad_email_inst" class="form-control form-control-sm mt-1" placeholder="nome.sobrenome@bombeiros.pe.gov.br">
            <div class="text-danger mt-1" style="font-size: 0.72rem;">Obrigatório terminar em <strong>@bombeiros.pe.gov.br</strong>. Um código de 6 dígitos será enviado para comprovar sua identidade funcional.</div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label fw-bold">OME:</label>
              <select id="cad_ome" class="form-select form-select-sm">${optionsOmes}</select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Subunidade / Setor:</label>
              <input type="text" id="cad_subunidade" class="form-control form-control-sm text-uppercase" placeholder="Ex: SEDE, ABT...">
            </div>
          </div>
        </div>
      `,
      width: '540px',
      showCancelButton: true,
      confirmButtonText: 'Avançar e Enviar Código <i class="fa-solid fa-arrow-right ms-1"></i>',
      cancelButtonText: 'Cancelar',
      confirmButtonColor: '#991b1b',
      preConfirm: () => {
        const nome = document.getElementById('cad_nome').value.trim();
        const email = document.getElementById('cad_email').value.trim().toLowerCase();
        const emailInst = document.getElementById('cad_email_inst').value.trim().toLowerCase();
        let cpf = document.getElementById('cad_cpf').value.trim().replace(/\D/g, '');
        const pin = document.getElementById('cad_pin').value.trim();
        const ome = document.getElementById('cad_ome').value;
        const subunidade = document.getElementById('cad_subunidade').value.trim() || 'GERAL';

        if (!nome || !email || !emailInst || !cpf || !pin || !ome) {
          Swal.showValidationMessage('Preencha todos os campos obrigatórios.');
          return false;
        }
        if (!emailInst.endsWith('bombeiros.pe.gov.br')) {
          Swal.showValidationMessage('O e-mail funcional deve obrigatoriamente terminar com @bombeiros.pe.gov.br');
          return false;
        }
        if (cpf.length === 10) cpf = '0' + cpf;
        if (cpf.length !== 11) {
          Swal.showValidationMessage('Informe um CPF válido com 11 dígitos.');
          return false;
        }
        if (pin.length < 4) {
          Swal.showValidationMessage('O PIN de assinatura deve conter de 4 a 6 números.');
          return false;
        }

        return { nome, email, emailInstitucional: emailInst, cpf, pin, ome, subunidade };
      }
    }).then(res => {
      if (res.isConfirmed && res.value) {
        const dadosForm = res.value;
        enviarOtpEExibirModalConfirmacao(dadosForm);
      }
    });
  }

  function enviarOtpEExibirModalConfirmacao(dadosForm) {
    Swal.fire({
      title: 'Enviando código...',
      html: `Gerando código de segurança para <strong>${dadosForm.emailInstitucional}</strong>...`,
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    google.script.run
      .withSuccessHandler(r => {
        exibirModalDigitarCodigoOtp(dadosForm);
      })
      .withFailureHandler(err => {
        Swal.fire('Erro no Envio', err.message, 'error');
      })
      .enviarCodigoVerificacaoInstitucional(dadosForm.emailInstitucional, dadosForm.nome);
  }

  function exibirModalDigitarCodigoOtp(dadosForm) {
    Swal.fire({
      title: '<i class="fa-solid fa-envelope-circle-check text-danger me-2"></i> Confirmar Identidade',
      html: `
        <div class="text-center p-2 small">
          <p class="text-muted mb-2">Um código numérico de <strong>6 dígitos</strong> foi enviado para:</p>
          <div class="badge bg-danger-subtle text-danger border border-danger-subtle p-2 fs-6 mb-3 text-wrap font-monospace">${dadosForm.emailInstitucional}</div>
          <p class="text-muted mb-3">Acesse o Webmail do CBMPE, localize a mensagem do SGMP e digite o código abaixo:</p>
          <input type="text" id="otp_codigo" class="form-control form-control-lg text-center fs-3 fw-bold font-monospace shadow-sm mx-auto" maxlength="6" placeholder="000000" style="letter-spacing: 8px; max-width: 220px;" autofocus>
          <div class="mt-3 text-muted" style="font-size: 0.75rem;">
            Não recebeu? Verifique a pasta de Spam/Lixo Eletrônico ou <a href="#" id="linkReenviarCodigo" class="text-danger fw-bold text-decoration-none">Reenviar código</a>.
          </div>
        </div>
      `,
      width: '460px',
      showCancelButton: true,
      confirmButtonText: '<i class="fa-solid fa-check me-1"></i> Validar e Concluir',
      cancelButtonText: 'Voltar',
      confirmButtonColor: '#991b1b',
      didOpen: () => {
        const linkReenviar = document.getElementById('linkReenviarCodigo');
        if (linkReenviar) {
          linkReenviar.onclick = (e) => {
            e.preventDefault();
            enviarOtpEExibirModalConfirmacao(dadosForm);
          };
        }
      },
      preConfirm: () => {
        const codigo = (document.getElementById('otp_codigo').value || '').trim();
        if (codigo.length !== 6) {
          Swal.showValidationMessage('Digite o código de 6 dígitos recebido por e-mail.');
          return false;
        }
        return codigo;
      }
    }).then(resOtp => {
      if (resOtp.isConfirmed && resOtp.value) {
        const codigoDigitado = resOtp.value;
        Swal.fire({
          title: 'Validando código...',
          html: 'Confirmando identidade com o servidor do CBMPE...',
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        google.script.run
          .withSuccessHandler(r => {
            Swal.fire({
              icon: 'success',
              title: 'Identidade Confirmada!',
              html: `
                <p>Sua identidade militar foi verificada com sucesso através do e-mail <strong>${dadosForm.emailInstitucional}</strong>.</p>
                <p class="small text-muted mb-0">A solicitação foi encaminhada para a <strong>DLOG / Administrador</strong> para liberação do acesso com sua conta Google.</p>
              `,
              confirmButtonColor: '#991b1b'
            });
          })
          .withFailureHandler(err => {
            Swal.fire({
              icon: 'error',
              title: 'Código Inválido',
              text: err.message,
              confirmButtonText: 'Tentar Novamente',
              confirmButtonColor: '#991b1b'
            }).then(() => {
              exibirModalDigitarCodigoOtp(dadosForm);
            });
          })
          .confirmarCodigoESolicitarAcesso(dadosForm, codigoDigitado);
      } else if (resOtp.dismiss === Swal.DismissReason.cancel) {
        abrirModalSolicitarAcesso();
      }
    });
  }
</script>
</body>
</html>
