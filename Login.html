  if (!APP_URL) {

          if (btn) btn.href = url.split('?')[0] + '?auth=true';

  function executarLoginGoogle(event) {
    var btn = document.getElementById('btnEntrarGoogle');
    var currentUrl = (window.location.href || '').split('?')[0].split('#')[0];
    var targetUrl = (currentUrl && currentUrl.indexOf('script.google.com') !== -1)
      ? currentUrl + '?auth=true'
      : (btn && btn.getAttribute('href') && btn.getAttribute('href') !== '#' ? btn.getAttribute('href') : '');
    if (targetUrl) {
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Entrando...';
      btn.style.pointerEvents = 'none';
      window.location.href = targetUrl;
      if (event) event.preventDefault();
      return false;
    }
    event.preventDefault();
    Swal.fire({ title: 'Entrando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    google.script.run
      .withSuccessHandler(url => {
        window.location.href = url.split('?')[0] + '?auth=true';
      })
      .withFailureHandler(err => {
        Swal.fire('Erro', "Erro ao autenticar: " + err.message, 'error');
      })
      .getAppUrl();
    return false;
  }

    // Validação silenciosa de compatibilidade no cliente
  function validarCompatibilidadeEmailNomeClient(email, nome) {
    if (!email || !nome) return false;
    var norm = function(str) {
      return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    };
    var emailLimpo = norm(email);
    var partesArroba = emailLimpo.split('@');
    var usuarioEmail = partesArroba[0].replace(/[^a-z0-9._-]/g, '');
    if (!usuarioEmail) return false;
    var nomeNorm = norm(nome).replace(/[^a-z0-9\s._-]/g, '');
    var stopWords = ['sd', 'cb', 'sgt', 'sub', 'ten', 'subten', 'asp', 'cap', 'maj', 'tc', 'cel', 'bm', 'de', 'da', 'do', 'das', 'dos', 'e', 'qobm', 'qpcbm', 'qocbm', 'qabm', 'al', 'ch', 'cmt', 'subcmt', 'chefe', 'bombeiro', 'militar', '1o', '2o', '3o', '1', '2', '3'];
    var tokensNome = nomeNorm.split(/[\s._-]+/).map(function(t){return t.trim();}).filter(function(t){return t.length >= 2 && stopWords.indexOf(t) === -1 && !/^\d+$/.test(t);});
    if (tokensNome.length === 0) tokensNome = nomeNorm.split(/[\s._-]+/).filter(function(t){return t.length >= 2;});
    if (tokensNome.length === 0) return false;
    var tokensEmail = usuarioEmail.split(/[^a-z]+/).filter(function(t){return t.length >= 2;});
    if (tokensEmail.length === 0) return false;
    var tokensSignificativosEmail = tokensEmail.filter(function(t){return t.length >= 3;});
    if (tokensSignificativosEmail.length > 0) {
      for (var i = 0; i < tokensSignificativosEmail.length; i++) {
        var te = tokensSignificativosEmail[i];
        var achou = false;
        for (var j = 0; j < tokensNome.length; j++) {
          if (tokensNome[j] === te) { achou = true; break; }
        }
        if (!achou) {
          var teTemp = te;
          for (var j = 0; j < tokensNome.length; j++) {
            if (tokensNome[j].length >= 3 && teTemp.indexOf(tokensNome[j]) !== -1) {
              teTemp = teTemp.replace(tokensNome[j], '');
            }
          }
          if (teTemp.length <= 1) achou = true;
        }
        if (!achou) return false;
      }
    }
    var primeiroNome = tokensNome[0];
    var primeiroNomeNoEmail = (tokensEmail.indexOf(primeiroNome) !== -1 || usuarioEmail.indexOf(primeiroNome) !== -1);
    if (!primeiroNomeNoEmail) {
      var partesPontos = usuarioEmail.split(/[^a-z]/);
      if (partesPontos[0] === primeiroNome.charAt(0)) primeiroNomeNoEmail = true;
    }
    return primeiroNomeNoEmail;
  }

      function enviarOtpEExibirModalConfirmacao(dadosForm) {
    if (!validarCompatibilidadeEmailNomeClient(dadosForm.emailInstitucional, dadosForm.nome)) {
      Swal.fire({
        icon: 'error',
        title: 'Validação Recusada',
        text: 'O processo de validação recusou o acesso.',
        confirmButtonColor: '#991b1b'
      });
      return;
    }

    Swal.fire({
      title: 'Verificando cadastro...',
      html: 'Consultando base de dados institucional...',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    // 1. Verifica se já existe cadastro ativo para este militar/e-mail
    google.script.run
      .withSuccessHandler(resExistente => {
        if (resExistente && resExistente.conflito) {
          Swal.fire({
            icon: 'warning',
            title: 'Atenção',
            text: resExistente.mensagem,
            confirmButtonColor: '#991b1b'
          });
          return;
        }

        if (resExistente && resExistente.recusado) {
          Swal.fire({
            icon: 'error',
            title: 'Validação Recusada',
            text: 'O processo de validação recusou o acesso.',
            confirmButtonColor: '#991b1b'
          });
          return;
        }

        if (resExistente && resExistente.existe) {
          Swal.fire({
            title: '<i class="fa-solid fa-user-check text-primary me-2"></i> Cadastro Já Existente',
            html: `
              <p class="text-muted small mb-3">Identificamos que já existe um cadastro ativo para este militar (<strong>${resExistente.nome || 'Militar'}</strong>) no SGMP.</p>
              <p class="text-dark small fw-bold mb-3">Deseja redefinir seu PIN de acesso recebendo um novo PIN temporário no seu e-mail institucional?</p>
              <div class="alert alert-light border small text-muted py-2 mb-0">
                O PIN temporário será enviado para: <strong>${dadosForm.emailInstitucional}</strong>
              </div>
            `,
            showCancelButton: true,
            confirmButtonText: '<i class="fa-solid fa-rotate-left me-1"></i> Sim, Redefinir PIN',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#991b1b',
            cancelButtonColor: '#64748b'
          }).then(resAction => {
            if (resAction.isConfirmed) {
              executarDisparoResetPin(resExistente.cpf || dadosForm.cpf || dadosForm.email, dadosForm.emailInstitucional);
            }
          });
          return;
        }

        // 2. Não existe cadastro: segue fluxo de envio de OTP para novo acesso
        Swal.fire({
          title: 'Enviando código...',
          html: `Gerando código de segurança para <strong>${dadosForm.emailInstitucional}</strong>...`,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        google.script.run
          .withSuccessHandler(r => {
            exibirModalDigitarCodigoOtp(dadosForm);
          })
          .withFailureHandler(err => {
            const msg = (err.message && err.message.indexOf('recusou o acesso') !== -1)
              ? 'O processo de validação recusou o acesso.'
              : (err.message || 'O processo de validação recusou o acesso.');
            Swal.fire({
              icon: 'error',
              title: 'Validação Recusada',
              text: msg,
              confirmButtonColor: '#991b1b'
            });
          })
          .enviarCodigoVerificacaoInstitucional(dadosForm.emailInstitucional, dadosForm.nome);
      })
      .withFailureHandler(err => {
        // Se houver falha de rede/banco na verificação prévia, tenta enviar OTP normalmente
        google.script.run
          .withSuccessHandler(r => {
            exibirModalDigitarCodigoOtp(dadosForm);
          })
          .withFailureHandler(errOtp => {
            Swal.fire({
              icon: 'error',
              title: 'Validação Recusada',
              text: 'O processo de validação recusou o acesso.',
              confirmButtonColor: '#991b1b'
            });
          })
          .enviarCodigoVerificacaoInstitucional(dadosForm.emailInstitucional, dadosForm.nome);
      })
      .verificarUsuarioExistente(dadosForm.email, dadosForm.cpf, dadosForm.emailInstitucional);
  }

      cancelButtonText: 'Voltar',
      confirmButtonColor: '#991b1b',
      didOpen: () => {
        const linkReenviar = document.getElementById('linkReenviarCodigo');
        if (linkReenviar) {
          linkReenviar.onclick = (e) => {
            e.preventDefault();
            enviarOtpEExibirModalConfirmacao(dadosForm);
          };
        }
      },
      preConfirm: () => {
        const codigo = (document.getElementById('otp_codigo').value || '').trim();
        if (codigo.length !== 6) {
          Swal.showValidationMessage('Digite o código de 6 dígitos recebido por e-mail.');
          return false;
        }
        return codigo;
      }
    }).then(resOtp => {
      if (resOtp.isConfirmed && resOtp.value) {
        const codigoDigitado = resOtp.value;
        Swal.fire({
          title: 'Validando código...',
          html: 'Confirmando identidade com o servidor do CBMPE...',
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        google.script.run
          .withSuccessHandler(r => {
            Swal.fire({
              icon: 'success',
              title: 'Identidade Confirmada!',
              html: `
                <p>Sua identidade militar foi verificada com sucesso através do e-mail <strong>${dadosForm.emailInstitucional}</strong>.</p>
                <p class="small text-muted mb-0">A solicitação foi encaminhada para a <strong>DLOG / Administrador</strong> para liberação do acesso com sua conta Google.</p>
              `,
              confirmButtonColor: '#991b1b'
            });
          })
          .withFailureHandler(err => {
            const ehRecusa = (err.message && err.message.indexOf('recusou o acesso') !== -1);
            Swal.fire({
              icon: 'error',
              title: ehRecusa ? 'Validação Recusada' : 'Código Inválido',
              text: err.message,
              confirmButtonText: 'Tentar Novamente',
              confirmButtonColor: '#991b1b'
            }).then(() => {
              if (ehRecusa) return;
              exibirModalDigitarCodigoOtp(dadosForm);
            });
          })
          .confirmarCodigoESolicitarAcesso(dadosForm, codigoDigitado);
      } else if (resOtp.dismiss === Swal.DismissReason.cancel) {
        abrirModalSolicitarAcesso();
      }
    });
  }
</script>
</body>
</html>
