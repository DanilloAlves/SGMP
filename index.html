<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SGMP — CBMPE | Sistema de Gestão de Materiais e Patrimônio</title>
  
  <!-- Ícone e Meta Tags -->
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/NOVO_BRAS%C3%83O_2024_CBMPE.png/500px-NOVO_BRAS%C3%83O_2024_CBMPE.png" type="image/png">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/NOVO_BRAS%C3%83O_2024_CBMPE.png/500px-NOVO_BRAS%C3%83O_2024_CBMPE.png">
  <meta name="theme-color" content="#991b1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SGMP - Sistema de Gestão de Materiais e Patrimônio do Corpo de Bombeiros Militar de Pernambuco">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    
    /* Container do App */
    #app-frame-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 10;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Tela de Carregamento Institucional */
    #loading-splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      background-color: rgba(185, 28, 28, 0.15);
      border: 2px solid #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #ef4444;
      margin-bottom: 1.25rem;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(239, 68, 68, 0.5); }
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      color: #ffffff;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      text-align: center;
      padding: 0 1rem;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    /* Fallback / Ajuda para Cookies de Terceiros */
    .cookie-hint {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      max-width: 420px;
      padding: 0 1rem;
      line-height: 1.4;
    }

    .cookie-hint a {
      color: #f87171;
      text-decoration: underline;
      cursor: pointer;
    }

    .cookie-hint a:hover {
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <!-- Tela de Carregamento -->
  <div id="loading-splash">
    <div class="brand-icon">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/NOVO_BRAS%C3%83O_2024_CBMPE.png/500px-NOVO_BRAS%C3%83O_2024_CBMPE.png" alt="CBMPE" style="width: 50px; height: 50px; object-fit: contain;">
    </div>
    <div class="brand-title">SGMP — CBMPE</div>
    <div class="brand-subtitle">Sistema de Gestão de Materiais e Patrimônio</div>
    <div class="spinner"></div>
    <div class="status-text" id="status-desc">Carregando ambiente seguro...</div>

    <div class="cookie-hint" id="cookie-hint" style="display: none;">
      Caso a tela de login não carregue automaticamente devido ao bloqueio de cookies do seu navegador:
      <br>
      <a id="direct-link" href="#" target="_top">Clique aqui para abrir o sistema em tela cheia</a>.
    </div>
  </div>

  <!-- Container do Web App -->
  <div id="app-frame-container">
    <iframe 
      id="app-frame" 
      src="about:blank"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // Normaliza para o domínio oficial de produção sgmp.vercel.app se aberto via preview URL
    if (window.location.hostname.endsWith('.vercel.app') && window.location.hostname !== 'sgmp.vercel.app') {
      window.location.replace('https://sgmp.vercel.app' + (window.location.search || '') + (window.location.hash || ''));
    }

    // URL Base do Web App do Google Apps Script
    const GAS_WEBAPP_BASE_URL = "https://script.google.com/macros/s/AKfycby0n-qt5bVAp96LnHgdMuNoa2l-I70Sz_FzxgSnjJThxMtiIUoUOcn5OJLEfhzDudGR2Q/exec";

    // Preserva parâmetros da URL (ex: ?checklist=true, ?c=..., etc)
    const currentSearch = window.location.search || "";
    const currentHash = window.location.hash || "";
    const targetUrl = GAS_WEBAPP_BASE_URL + currentSearch + currentHash;

    const frame = document.getElementById("app-frame");
    const splash = document.getElementById("loading-splash");
    const directLink = document.getElementById("direct-link");
    const cookieHint = document.getElementById("cookie-hint");
    const statusDesc = document.getElementById("status-desc");

    directLink.href = targetUrl;

    // Define o src do iframe
    frame.src = targetUrl;

    // Remove a tela de splash quando o iframe carregar
    frame.addEventListener("load", function() {
      setTimeout(function() {
        splash.style.opacity = "0";
        splash.style.visibility = "hidden";
      }, 500);
    });

    // Se demorar mais que 6 segundos (ex: login google exigindo clique direto), exibe o link de contingência
    setTimeout(function() {
      if (splash.style.visibility !== "hidden") {
        cookieHint.style.display = "block";
        statusDesc.innerText = "Conectando ao servidor Google...";
      }
    }, 6000);
  </script>
</body>
</html>
